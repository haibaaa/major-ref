[project]
name = "fhe-compare"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openfhe==1.6.1.0.24.4",
    "pandas>=3.1.1",
    "phe>=1.5.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
